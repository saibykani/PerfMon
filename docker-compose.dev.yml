# Dependencies only — run backend/frontend locally with `npm run dev`.
# docker compose -f docker-compose.dev.yml up -d
name: perfmon-dev
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: perfmon, POSTGRES_USER: perfmon, POSTGRES_PASSWORD: perfmon }
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6380}:6379"]
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:latest}
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: perfmon, MINIO_ROOT_PASSWORD: perfmon-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-dev:/data]
volumes:
  pgdata-dev:
  minio-dev:
