# Render blueprint — 24/7 hosting for the Perfmon backend API (Render free web service + Neon free PostgreSQL).
#
# 1. Create a Neon project (https://neon.tech, region close to you, e.g. AWS Asia Pacific (Singapore)) and copy the
#    DIRECT connection string (NOT the "-pooler" host — the job queue uses LISTEN/NOTIFY), e.g.
#    postgresql://user:pass@ep-xxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
# 2. Render dashboard → New → Blueprint → select this repo → fill in DATABASE_URL and DEMO_ADMIN_PASSWORD → Apply.
# 3. Put the service URL (https://perfmon-api.onrender.com or the name Render assigns) into the /api and
#    /report-content rewrites of vercel.json and frontend/vercel.json, and into .github/workflows/keepalive.yml.
#
# Free-tier notes: the service sleeps after ~15 minutes without traffic; .github/workflows/keepalive.yml pings it
# every 10 minutes so it stays awake. There is no persistent disk, so uploads are stored in PostgreSQL
# (STORAGE_DRIVER=postgres; Neon free = 0.5 GB). Upgrade `plan` to starter and use S3/R2 storage for heavier use.
services:
  - type: web
    name: perfmon-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Neon direct connection string (sslmode=require)
      - key: STORAGE_DRIVER
        value: postgres
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: REPORT_CONTENT_ORIGIN
        value: ""            # report content is served from the same host, CSP-sandboxed
      - key: PUBLIC_URL
        value: https://perf-mon.vercel.app
      - key: CORS_ORIGINS
        value: https://perf-mon.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
      - key: SHOW_DEMO_CREDENTIALS
        value: "false"
      - key: DEMO_ADMIN_EMAIL
        value: admin@perfmon.local
      - key: DEMO_ADMIN_PASSWORD
        sync: false          # initial administrator password (only used when the database has no users)
