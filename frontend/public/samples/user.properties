# Perfmon settings for JMeter — append to JMETER_HOME/bin/user.properties or pass with:  jmeter -q perfmon.properties ...
# Values here are placeholders. Keep real API keys out of files: pass -Jperfmon.token=... from a secret store instead.

# Perfmon API as reachable from this load generator
perfmon.url=http://perfmon.example.com:8080

# Changes every execution — pass on the command line: -Jperfmon.runId=PF-2026-10-07-000127
# perfmon.runId=

# API key with scope "ingest" — prefer: -Jperfmon.token=$PERFMON_API_KEY
# perfmon.token=pmk_xxxxxxxx_xxxxxxxxxxxxxxxxxxxxxxxxxxxx

# How often the Backend Listener sends statistics (seconds). 5 is a good default.
backend_influxdb.send_interval=5

# Load profile used by perfmon-sample-test.jmx
users=10
rampup=30
duration=300
target.host=httpbin.org
target.protocol=https
