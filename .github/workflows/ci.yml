# Continuous integration: install, typecheck, unit tests and the frontend production build.
# Unit tests are pure (no database, no network), so no services are needed.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck backend
        run: npx tsc -p backend/tsconfig.json --noEmit

      - name: Typecheck frontend
        run: npx tsc -p frontend/tsconfig.json --noEmit

      - name: Backend unit tests
        run: npm test --workspace backend

      - name: Frontend unit tests
        run: npm test --workspace frontend

      - name: Frontend build
        working-directory: frontend
        # typecheck already ran above; build the bundle only
        run: npx vite build
