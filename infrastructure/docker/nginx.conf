server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 600m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Uploaded HTML reports are framed from the separate report-content origin (port 8081).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' http://localhost:8081 https:; object-src 'none'; base-uri 'self'" always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-Sent Events (live monitoring)
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /metrics { proxy_pass http://backend:8080; }

  location / {
    try_files $uri /index.html;
  }
}
